/* =====================================================
   PARDESI VIP SYSTEM
   SHAKIR HASSAN PARDESI
   2022 - 2026
===================================================== */

:root{

    --red:#ff1744;
    --red2:#ff003c;

    --green:#00ff9d;
    --cyan:#00e5ff;

    --gold:#ffd166;
    --purple:#a855f7;

    --bg:#010204;
    --panel:rgba(5,7,12,.97);

    --text:#ffffff;
    --dim:#77818d;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    margin:0;
    width:100%;
    height:100%;

    overflow:hidden;

    background:#010204;
    color:#fff;

    font-family:
        "Courier New",
        monospace;
}

body{

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before{

    content:"";

    position:fixed;
    inset:0;

    background:

    radial-gradient(
        circle at 15% 20%,
        rgba(255,23,68,.20),
        transparent 30%
    ),

    radial-gradient(
        circle at 85% 25%,
        rgba(0,229,255,.12),
        transparent 30%
    ),

    radial-gradient(
        circle at 50% 90%,
        rgba(168,85,247,.12),
        transparent 35%
    ),

    linear-gradient(
        135deg,
        #010204,
        #090c12,
        #010204
    );

    animation:
        backgroundPulse
        9s ease-in-out infinite alternate;
}

@keyframes backgroundPulse{

    from{
        filter:hue-rotate(0deg);
    }

    to{
        filter:hue-rotate(20deg);
    }
}


/* GRID */

.grid{

    position:fixed;
    inset:0;

    background-image:

    linear-gradient(
        rgba(255,255,255,.025) 1px,
        transparent 1px
    ),

    linear-gradient(
        90deg,
        rgba(255,255,255,.025) 1px,
        transparent 1px
    );

    background-size:23px 23px;

    pointer-events:none;
}


/* SCAN */

.scan{

    position:fixed;

    left:0;

    width:100%;
    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--red),
            transparent
        );

    box-shadow:
        0 0 18px var(--red);

    animation:
        scanLine
        5s linear infinite;

    opacity:.45;

    pointer-events:none;
}

@keyframes scanLine{

    from{
        top:-5%;
    }

    to{
        top:105%;
    }
}


/* =====================================================
   MAIN CARD
===================================================== */

.card{

    width:94%;
    max-width:430px;

    height:min(750px,94vh);

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(10,12,18,.98),
            rgba(2,3,7,.98)
        );

    border:
        1px solid
        rgba(255,23,68,.65);

    box-shadow:

        0 0 25px
        rgba(255,23,68,.18),

        0 0 70px
        rgba(0,229,255,.07),

        inset 0 0 45px
        rgba(0,0,0,.95);

    clip-path:
        polygon(
            18px 0,
            calc(100% - 18px) 0,
            100% 18px,
            100% calc(100% - 18px),
            calc(100% - 18px) 100%,
            18px 100%,
            0 calc(100% - 18px),
            0 18px
        );

    z-index:5;
}


/* INNER BORDER */

.card::after{

    content:"";

    position:absolute;

    inset:7px;

    border:
        1px solid
        rgba(255,23,68,.20);

    pointer-events:none;

    z-index:100;
}


/* CORNERS */

.corner{

    position:absolute;

    width:19px;
    height:19px;

    border-color:var(--red);

    z-index:110;
}

.c1{
    top:12px;
    left:12px;
    border-top:2px solid;
    border-left:2px solid;
}

.c2{
    top:12px;
    right:12px;
    border-top:2px solid;
    border-right:2px solid;
}

.c3{
    bottom:12px;
    left:12px;
    border-bottom:2px solid;
    border-left:2px solid;
}

.c4{
    bottom:12px;
    right:12px;
    border-bottom:2px solid;
    border-right:2px solid;
}


/* =====================================================
   TOP BAR
===================================================== */

.topline{

    position:absolute;

    top:0;
    left:17px;
    right:17px;

    height:22px;

    overflow:hidden;

    background:
        linear-gradient(
            90deg,
            #9d001f,
            var(--red),
            #7b00b8,
            var(--red)
        );

    z-index:120;
}

.marquee{

    white-space:nowrap;

    font-size:8px;

    line-height:22px;

    letter-spacing:2px;

    font-weight:900;

    animation:
        marquee
        16s linear infinite;
}

@keyframes marquee{

    from{
        transform:translateX(100%);
    }

    to{
        transform:translateX(-100%);
    }
}


/* =====================================================
   HEADER
===================================================== */

.header{

    position:absolute;

    top:38px;
    left:0;

    width:100%;

    text-align:center;

    z-index:20;
}


/* WELCOME */

.welcome-small{

    font-size:10px;

    letter-spacing:4px;

    font-weight:900;

    color:#fff;

    text-shadow:
        0 0 8px #fff;

    margin-bottom:5px;
}


/* PARDESI */

.title{

    position:relative;

    display:inline-block;

    font-size:34px;

    line-height:35px;

    font-weight:1000;

    letter-spacing:6px;

    color:var(--red);

@keyframes titleMove{

}


/* VIP */

.subtitle{

/* ONLY VIP MEMBER */

.vip-member{

    top:42px;

        1px solid

    letter-spacing:1.4px;

    font-weight:900;

    box-shadow:
        0 0 12px

    transform:rotate(90deg);

    transform-origin:right top;
}


/* =====================================================
   SECURITY STATUS
   SEPARATE POSITION - NO OVERLAP
===================================================== */

.status{

    position:absolute;

    top:105px;
    right:20px;
    left:20px;

    width:auto;

    text-align:center;

    z-index:25;

    font-size:7px;

    letter-spacing:2px;

    font-weight:900;

    color:var(--green);

    text-shadow:
        0 0 10px var(--green);

    animation:
        blink
        1.5s infinite;
}

@keyframes blink{

    50%{
        opacity:.35;
    }
}


/* =====================================================
   HACKER CIRCLE
===================================================== */

.hacker-area{

    position:absolute;

    top:125px;

    left:0;

    width:100%;

    height:145px;

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:15;
}


/* ROTATING OUTER */

.hacker-ring{

    position:relative;

    width:130px;
    height:130px;

    border-radius:50%;

    border:
        2px solid
        var(--red);

    box-shadow:

        0 0 10px var(--red),

        0 0 25px
        rgba(255,23,68,.55),

        inset 0 0 22px
        rgba(255,23,68,.30);

    animation:
        ringRotate
        5s linear infinite;
}

@keyframes ringRotate{

    to{
        transform:rotate(360deg);
    }
}


/* ROTATING DASH */

.hacker-ring::before{

    content:"";

    position:absolute;

    inset:-8px;

    border-radius:50%;

    border:
        2px dashed
        rgba(255,23,68,.75);

    animation:
        ringRotateReverse
        3s linear infinite;
}

@keyframes ringRotateReverse{

    to{
        transform:rotate(-360deg);
    }
}


/* IMAGE */

.hacker-image{

    position:absolute;

    inset:10px;

    border-radius:50%;

    overflow:hidden;

    border:
        2px solid
        var(--red);

    background:#050505;

    box-shadow:
        inset 0 0 30px #000,
        0 0 18px rgba(255,23,68,.5);

    animation:
        hackerPulse
        2.2s ease-in-out infinite alternate;
}

@keyframes hackerPulse{

    from{
        box-shadow:
            inset 0 0 30px #000,
            0 0 12px rgba(255,23,68,.4);
    }

    to{
        box-shadow:
            inset 0 0 35px #000,
            0 0 30px rgba(255,23,68,.8);
    }
}

.hacker-image img{

    width:100%;
    height:100%;

    object-fit:cover;

    filter:
        contrast(1.25)
        brightness(.72)
        saturate(.7);
}


/* IMAGE SCAN */

.hacker-image::after{

    content:"";

    position:absolute;

    left:0;
    right:0;

    top:-5px;

    height:2px;

    background:#fff;

    box-shadow:
        0 0 12px var(--red);

    animation:
        hackerScan
        2.8s linear infinite;
}

@keyframes hackerScan{

    from{
        top:-3px;
    }

    to{
        top:100%;
    }
}

===================================================== */

.popup-overlay{

    display:none;

    position:absolute;

    inset:0;

    z-index:200;

    align-items:center;

    justify-content:center;

.popup-overlay.show{

        popupFade
        .25s ease;

@keyframes popupFade{

    from{
        opacity:0;
    }

    to{

}


.popup{

    width:100%;

    padding:25px 18px;

@keyframes popupZoom{

    from{
